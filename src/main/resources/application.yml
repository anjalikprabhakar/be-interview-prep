spring:
  application:
    name: be-interview-prep
  datasource:
    url: jdbc:h2:mem:appdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations
  flyway:
    locations: classpath:db/migration

app:
  base-url: http://localhost:8080   # prefix for shortUrl in POST /api/urls responses

  jwt:
    # HS256 signing key (at least 32 bytes). Supplied by the environment only: no default, so the app
    # refuses to start without it instead of silently using a key from source control.
    secret: ${JWT_SECRET}
  admin:
    # Optional: when both are set, an ADMIN account is created on startup (see AdminSeeder).
    # Empty defaults mean "no admin", not a fallback credential.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
