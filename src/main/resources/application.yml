spring:
  application:
    name: be-interview-prep
  datasource:
    url: jdbc:h2:mem:appdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations
  flyway:
    locations: classpath:db/migration
